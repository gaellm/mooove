name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, package, publish
    runs-on: macos-26

    env:
      # Everything below is optional. With no Apple Developer Program
      # membership these are empty, the signing and notarization steps
      # skip themselves, and the release ships an ad-hoc signed DMG.
      # Adding the secrets later turns those steps on with no edits here.
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      # --- Optional signing setup -------------------------------------
      # Skipped entirely while APPLE_CERTIFICATE_P12_BASE64 is unset.
      - name: Import Developer ID certificate
        if: env.APPLE_CERTIFICATE_P12_BASE64 != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          # Without this, codesign blocks on a GUI keychain prompt that
          # nobody is there to answer, and the job hangs until timeout.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
      # ----------------------------------------------------------------

      - name: Build app
        id: build
        run: ./scripts/build-macos.sh

      - name: Create DMG
        id: dmg
        run: |
          brew install create-dmg
          ./scripts/create-dmg.sh

      # --- Optional notarization --------------------------------------
      # Submitting the DMG covers the app inside it, so this is one
      # submission, not two. Stapling writes the ticket into the DMG so
      # first launch works offline.
      - name: Notarize and staple
        if: env.APPLE_ID != '' && env.APPLE_SIGNING_IDENTITY != ''
        run: |
          set -euo pipefail
          DMG="$(ls dist/MooOve-*.dmg | head -1)"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
      # ----------------------------------------------------------------

      - name: Verify release artifacts
        run: ./scripts/verify-release.sh --expect-arch arm64

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 MooOve-*.dmg > SHA256SUMS
          cat SHA256SUMS

      - name: Write release notes
        run: |
          set -euo pipefail
          DMG_NAME="$(basename "$(ls dist/MooOve-*.dmg | head -1)")"

          # The first-launch steps are the single most important thing in
          # the notes: this build is not notarized, so macOS will refuse
          # to open it until the user explicitly allows it. Burying that
          # in the docs site guarantees "the app is broken" issues.
          cat > dist/RELEASE_NOTES.md <<EOF
          ## Install

          1. Download \`$DMG_NAME\` below.
          2. Open it and drag **MooOve** into **Applications**.
          3. **First launch:** double-clicking will say MooOve "cannot be
             opened". That is expected — MooOve is not signed with a paid
             Apple Developer certificate. Open
             **System Settings → Privacy & Security**, scroll down, and
             click **Open Anyway** next to the MooOve message. Confirm once.
          4. MooOve will ask for **Accessibility** permission the first
             time you move a window. Grant it in
             **System Settings → Privacy & Security → Accessibility**.
             MooOve cannot move windows without it.

             Prefer the terminal? \`xattr -dr com.apple.quarantine /Applications/MooOve.app\`
             does step 3 in one line.

          Full instructions: https://${{ github.repository_owner }}.github.io/mooove/installation/

          ## Requirements

          - macOS 26 or later
          - Apple Silicon

          ## Verify your download

          \`\`\`
          shasum -a 256 -c SHA256SUMS
          \`\`\`

          ---
          EOF
          cat dist/RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/MooOve-*.dmg
            dist/SHA256SUMS

      - name: Clean up keychain
        if: always() && env.KEYCHAIN != ''
        run: security delete-keychain "$KEYCHAIN" || true
